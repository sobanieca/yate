[package]
name = "yate"
version = "0.5.0"
edition = "2024"
description = "Yet another text editor: a modeless terminal editor with JavaScript plugins"
license = "MIT"
repository = "https://github.com/sobanieca/yate"
publish = false

[dependencies]
crossterm = "0.29"
flate2 = "1"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
rquickjs = "0.14.0"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
ignore = "0.4"
nucleo-matcher = "0.3"
similar = "3"
unicode-width = "0.2"
unicode-segmentation = "1.13"
regex = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-sequel = "0.3"
tree-sitter-zig = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-svelte-ng = "1.0"
tree-sitter-elixir = "0.3"
tree-sitter-haskell = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-make = "1.1"
tree-sitter-xml = "0.7"
tree-sitter-graphql = "0.3"
tree-sitter-hcl = "1.1"
tree-sitter-diff = "0.1"
tree-sitter-nix = "0.3"
tree-sitter-dart = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-prisma-io = "1.6"

[workspace]
members = ["xtask"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
